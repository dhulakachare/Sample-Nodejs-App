name: Build and Publish Docker Image

on:
  workflow_dispatch: 
  
jobs:
  Build_Publish_Docker_Image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Build Docker Image
        run: docker build . --file Dockerfile -t sample-nodejs-app:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Image to DockerHub
        run: |  
          docker tag sample-nodejs-app:latest ${{ secrets.DOCKER_USERNAME }}/sample-nodejs-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/sample-nodejs-app:latest
  
  











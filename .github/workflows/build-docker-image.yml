name: Build and Publish Docker Image

on:
  workflow_dispatch: 
  
jobs:
  Build_Publish_Docker_Image:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build . --file Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to DockerHub
        run: |  
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest
  
      - name: Start Minikube
        uses: medyagh/setup-minikube@latest

      - name: Verify cluster!
        run: |
          kubectl get nodes
          kubectl cluster-info
          kubectl get pods -A

      - name: Deploy to minikube
        run: |
          kubectl apply -f deploy-k8s.yaml
          kubectl wait --for=condition=ready pod -l app=local/nodejs-app

      - name: Test service URLs
        run: |
          minikube service list
          minikube service local-nodejs-app-svc --url
          echo "------------------opening the service------------------"
          curl $(minikube service local-nodejs-app-svc --url)












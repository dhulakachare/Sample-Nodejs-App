name: Minikube Deployment

on:
  workflow_dispatch:

jobs:
  Deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: build nodejs-app and deploy to minikube

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          cpus: 2
          memory: 4096

      - name: Verify cluster
        run: |
          kubectl get nodes
          kubectl get pods -A

      - name: Build Docker image
        run: docker build -t dhulakachare/nodejs-app:latest .

      - name: Load image into Minikube
        run: minikube image load dhulakachare/nodejs-app:latest

      - name: Deploy to Minikube
        run: |
          kubectl apply -f deploy-k8s.yml
          kubectl rollout status deployment/nodejs-app-deployment --timeout=180s
          kubectl get pods -A

      - name: Test the service URL
        run: |
          minikube service list
          SERVICE_URL=$(minikube service nodejs-app-service --url)
          echo "Service URL: $SERVICE_URL"
          curl -fsS "$SERVICE_URL"

# This CICD workflow performs following actions:
# Job1: Build the Node.js application
# Job2: Run tests
# Job3: Upload build artifacts to GitHub Actions
# Job4: Build Docker image and push to DockerHub
# Job5: Deploy the application to Minikube and test the service URL

name: Node.js CI-CD Pipeline

on:
  workflow_dispatch: 
  #  push:
   # branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ] 

jobs:
  Build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5  

    - name: Cache Depenedencies
      uses: actions/cache@v5 # 
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Set up Node.js
      uses: actions/setup-node@v5 
      with:
        node-version: 24
        cache: 'npm' 

    - name: Install Node.js dependencies
      run: npm ci 

    - name: Build Website
      run: npm run build

  Test:
    needs: Build 
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5 
    
    - name: Cache Depenedencies
      uses: actions/cache@v5 
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Run tests
      run: npm run test

    - name: Start Application Server
      run: npm start & 
    
  Upload_Artifacts:
    needs: Test
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            dist
            package.json

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
    
      - name: Output Contents
        run:
          ls
          
  DevSecops_Scan:
    needs: Test
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v2
        with:
        # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0
      - name: Run SonarQube SAST Scan
        uses: sonarsource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}  
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} 

      - name: Run Snyk SCA Scan
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Run OWASP ZAP DAST Scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: 'http://localhost:3000'
          network_mode: host
          cmd_options: '-a'
          # fail_action: false

        
  Docker_Build:
    needs: [ Upload_Artifacts, DevSecops_Scan ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # name: Build nodejs-app and deploy to minikube

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: docker build . --file Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to DockerHub
        run: |  
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest

  Deploy_to_Minikube:
    needs: Docker_Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Start Minikube
        uses: medyagh/setup-minikube@e9e035a86bbc3caea26a450bd4dbf9d0c453682e
        with:
          driver: docker
          cpus: 2
          memory: 4096

      - name: Verify Cluster !!
        run: |
          kubectl get nodes
          kubectl get pods -A

      - name: Pull image into Minikube
        run: |
          eval $(minikube docker-env)
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest

      - name: Deploy to Minikube
        run: |
          kubectl apply -f deploy-k8s.yml
          kubectl rollout status deployment/nodejs-app-deployment --timeout=180s
          kubectl get pods -A
          # kubectl port-forward nodejs-app 30080:3000

      - name: Test Service URLs
        run: |
          minikube service list
          SERVICE_URL=$(minikube service nodejs-app-service --url)
          echo "Service URL: $SERVICE_URL"
          curl -fsS "$SERVICE_URL"
        # minikube service --port-forward nodejs-app-service 30080:3000



    
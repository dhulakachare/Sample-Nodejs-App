# This CICD workflow performs following actions:
# Job1: Build the Node.js application
# Job2: Run tests.
# Job3: Upload build artifacts to GitHub Actions.
# Job4: Build Docker image and push to DockerHub.
# Job5: Deploy the application to Minikube and test the service URL.

name: Node.js CI-CD Pipeline

on:
  workflow_dispatch: 
  #push:
   # branches: [ "main" ]
  #pull_request:
  #  branches: [ "main" ] 

jobs:
  Build:
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5  

    - name: Cache Depenedencies
      uses: actions/cache@v5 # 
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Set up Node.js
      uses: actions/setup-node@v5 
      with:
        node-version: 24
        cache: 'npm' 

    - name: Install Node.js dependencies
      run: npm ci 

    - name: Build Website
      run: npm run build

  Test:
    needs: Build 
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5 
    
    - name: Cache Depenedencies
      uses: actions/cache@v5 
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}

    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Run tests
      run: npm run test
    
  Upload_Artifacts:
    needs: Test
    runs-on: ubuntu-24.04
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts
          path: |
            dist
            package.json

      - name: Download Build Artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
    
      - name: Output Contents
        run:
          ls    
        
  Docker_Build:
    needs: Upload_Artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # name: Build nodejs-app and deploy to minikube

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Build Docker Image
        run: docker build . --file Dockerfile -t ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker Image to DockerHub
        run: |  
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest

  Deploy_to_Minikube:
    needs: Docker_Build
    runs-on: ubuntu-24.04
    timeout-minutes: 30 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Start Minikube
        uses: medyagh/setup-minikube@latest
        with:
          driver: docker
          cpus: 2
          memory: 4096

      - name: Verify Cluster !!
        run: |
          kubectl get nodes
          kubectl get pods -A

      - name: Pull image into Minikube
        run: |
          eval $(minikube docker-env)
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/nodejs-app:latest

      - name: Deploy to Minikube
        run: |
          kubectl apply -f deploy-k8s.yml
          kubectl rollout status deployment/nodejs-app-deployment --timeout=180s
          kubectl get pods -A

      - name: Test Service URLs
        run: |
          minikube service list
          SERVICE_URL=$(minikube service nodejs-app-service --url)
          echo "Service URL: $SERVICE_URL"
          curl -fsS "$SERVICE_URL"



    